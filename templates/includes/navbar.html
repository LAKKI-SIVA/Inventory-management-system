{% load static %}
<nav class="navbar">
    <div class="navbar-brand">
        <!-- We will put an image logo here later using {% static 'images/logo/logo.png' %} -->
        <h1>Inventory System</h1>
    </div>
    
    <div class="navbar-menu">
        <!-- If user is logged in -->
        {% if user.is_authenticated %}
            <a href="{% url 'ui_inventory_dashboard' %}" class="nav-link">Dashboard</a>
            <a href="{% url 'ui_product_list' %}" class="nav-link">Products</a>
            <a href="{% url 'ui_order_list' %}" class="nav-link">Orders</a>
            
            <span class="nav-user">Welcome, {{ user.first_name|default:user.username }} ({{ user.get_role_display }})</span>
            
            <form action="{% url 'ui_logout' %}" method="POST" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline">Logout</button>
            </form>
        <!-- If user is NOT logged in -->
        {% else %}
            <a href="#" class="btn btn-primary">Login</a>
            <a href="#" class="btn btn-secondary">Register</a>
        {% endif %}
    </div>
</nav>
